name: Deploy site

# Builds the site and publishes it to GitHub Pages at https://stormx.codyparham.com/.
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "workers/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refuse a privileged Supabase key
        env:
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # Only a publishable key may ship to the browser; a secret or service_role key never.
          case "$KEY" in
            ""|sb_publishable_*) exit 0;;
            eyJ*)  # legacy JWT key: allowed only with role "anon"
              payload=$(printf '%s' "$KEY" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
              role=$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.role // empty' 2>/dev/null || true)
              [ "$role" = anon ] && exit 0;;
          esac
          echo "::error::SUPABASE_ANON_KEY must be the publishable (sb_publishable_...) or anon key, never a secret or service_role key"
          exit 1
      - name: Build
        run: npm run build
        env:
          # Public by design: basemap-only key, restricted by referrer to the site.
          VITE_ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          # The data Worker's workers.dev URL (repository variable, set once the Worker is deployed).
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          # Public by design: row-level security guards every table.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
