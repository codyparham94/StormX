name: ETL outage history

# Run by hand (and once a year when ORNL adds a year): streams the EAGLE-I county outage CSVs for
# 2014 to 2025 from Figshare (about 11 GB, never written to disk) and writes history/outages/ in R2:
# daily county peaks per month for the replay, the biggest events, and the county heatmap.
# Takes about 15 minutes.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 15 3 *"

permissions:
  contents: read

concurrency:
  group: etl-history
  cancel-in-progress: false

jobs:
  eaglei:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet .
      - run: python -m stormx_etl.history out
      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ../scripts/upload-r2.sh out
