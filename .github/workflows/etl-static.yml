name: ETL static files

# Monthly: ZIP code centroids for the forecast popup (Census ZCTA Gazetteer) to static/zcta.json,
# a snapshot of the HIFLD substations to grid/substations.geojson for the map to fall back on, and
# the grid exposure per H3 cell to risk/exposure-res6.json for the hourly risk job.

on:
  schedule:
    - cron: "41 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl
    env:
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet .
      - run: python -m stormx_etl.zcta out
      - run: python -m stormx_etl.grid out
      - run: python -m stormx_etl.exposure out "${DATA_BASE_URL:?set the DATA_BASE_URL repository variable}"
      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ../scripts/upload-r2.sh out
