[project]
name = "stormx-etl"
version = "0.1.0"
description = "StormX ETL: fetches public feeds and writes the files the site reads from R2"
requires-python = ">=3.12"
dependencies = ["pyshp==2.3.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stormx_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
